[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offload"
version = "0.1.0"
description = "Photo-to-sale resale engine: item identification, negotiation, and posting as the user."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.2",
  "pydantic>=2.7",
  "pillow>=10",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
offload = "offload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
