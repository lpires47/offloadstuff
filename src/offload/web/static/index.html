<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find it</title>
<style>
:root{--bg:#faf9f6;--fg:#1d1c1a;--muted:#6f6b64;--line:#e6e2da;--card:#fff;--accent:#2f5d50;--good:#2f7a4a;--high:#a5462f;--chip:#efece5}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--fg:#f0eee9;--muted:#a19c93;--line:#2c2a26;--card:#1d1c19;--accent:#8fc4b2;--good:#7fcf98;--high:#e6957f;--chip:#2a2824}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}h2{font-size:15px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
button,.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button[aria-pressed=true]{border-color:var(--fg);font-weight:600}
.row{display:flex;gap:8px;align-items:center}input[type=text],input[type=number],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit}
label.cam{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);cursor:pointer;margin-bottom:10px}
label.cam input{display:none}.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.status{color:var(--muted);font-size:13px;min-height:18px;margin:10px 0}
.profile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.profile .what{font-weight:600;font-size:17px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}.chip.must{outline:1.5px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-decoration:none;color:inherit}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--chip)}.card .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.card .t{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:650}.src{font-size:12px;color:var(--muted)}.why{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;width:fit-content}.badge.good_price{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}.badge.high{color:var(--high);background:color-mix(in srgb,var(--high) 14%,transparent)}.badge.typical{color:var(--muted);background:var(--chip)}
.empty{color:var(--muted);font-size:14px}.prelim{opacity:.7}
.signoff{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.signoff .k{font-size:12px;color:var(--muted);margin-bottom:4px}.flag{color:var(--high);font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="title">Find it</h1>
  <div class="tabs" role="tablist">
    <button id="tab-find" aria-pressed="true">Find</button>
    <button id="tab-sell" aria-pressed="false">Sell</button>
  </div>

  <section id="find">
    <label class="cam">📷 Take or choose a photo<input id="find-photo" type="file" accept="image/*" capture="environment" multiple></label>
    <div class="thumbs" id="find-thumbs"></div>
    <div class="row"><input id="find-text" type="text" placeholder="…or describe it: “Cesca chair, cane seat, under $400”"><button class="primary" id="find-go">Find</button></div>
    <div class="status" id="find-status"></div>
    <div id="find-profile"></div>
    <div id="ladder"></div>
  </section>

  <section id="sell" hidden>
    <label class="cam">📷 Photos of the item (front, tag, details)<input id="sell-photo" type="file" accept="image/*" capture="environment" multiple></label>
    <div class="thumbs" id="sell-thumbs"></div>
    <button class="primary" id="sell-go" style="width:100%">Make my listing</button>
    <div class="status" id="sell-status"></div>
    <div id="signoff"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const money = c => c == null ? "—" : "$" + Math.round(c / 100).toLocaleString();
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
let run = null, segment = null;

function tab(name){
  for (const t of ["find","sell"]) { $("#"+t).hidden = t !== name; $("#tab-"+t).setAttribute("aria-pressed", t === name); }
  $("#title").textContent = name === "find" ? "Find it" : "Sell it";
}
$("#tab-find").onclick = () => tab("find"); $("#tab-sell").onclick = () => tab("sell");

function thumbs(input, box){ input.onchange = () => { box.innerHTML = ""; for (const f of input.files) { const i = new Image(); i.src = URL.createObjectURL(f); box.append(i); } }; }
thumbs($("#find-photo"), $("#find-thumbs")); thumbs($("#sell-photo"), $("#sell-thumbs"));

function profileView(p){
  const what = [p.brand, p.model_name, p.variant].filter(Boolean).join(" ") || p.subcategory;
  const by = p.designer ? ` · ${esc(p.designer)}` : ""; const era = p.era ? ` · ${esc(p.era)}` : "";
  return `<div class="profile"><div class="what">${esc(what)}</div><div class="src">${esc(p.subcategory)}${by}${era}</div>
    <div class="chips">${p.defining_details.map(d => `<span class="chip ${d.must_match ? "must" : ""}" title="${esc(d.why)}">${esc(d.detail)}</span>`).join("")}</div></div>`;
}

function card(r){
  const l = r.listing, img = l.image_urls[0] ? `<img loading="lazy" src="${esc(l.image_urls[0])}" alt="">` : `<img alt="">`;
  const badge = r.price_badge ? `<span class="badge ${r.price_badge}">${{good_price:"Good price",typical:"Typical price",high:"High"}[r.price_badge]}</span>` : "";
  return `<a class="card" href="${esc(l.url)}" target="_blank" rel="noopener" data-src="${esc(l.source)}" data-rung="${r.rung}">${img}
    <div class="b"><div class="t">${esc(l.title)}</div><div class="row" style="gap:6px"><span class="price">${money(l.price_cents)}</span>${badge}</div>
    <div class="src">${esc(l.source.replace("shopify:",""))}</div><div class="why">${esc(r.reason)}</div></div></a>`;
}

function ladderView(L, stage){
  const sec = (name, items, none, extra = "") => `<h2>${name}${items.length ? ` · ${items.length}` : ""}${extra}</h2>` +
    (items.length ? `<div class="grid">${items.map(card).join("")}</div>` : `<div class="empty">${none}</div>`);
  const typical = L.typical_used_cents ? ` · typically ${money(L.typical_used_cents)}` : "";
  return `<div class="${stage === "final" ? "" : "prelim"}">` +
    sec("The exact item, new", L.exact_new, stage === "final" ? "Not found new right now." : "Searching…") +
    sec("The exact item, used", L.exact_used, stage === "final" ? "No used listings of this exact item right now." : "Searching…", typical) +
    sec("Similar", L.similar, stage === "final" ? "Nothing close enough yet." : "Searching…") + `</div>`;
}

$("#ladder").addEventListener("click", e => {
  const a = e.target.closest("a.card"); if (!a || !run) return;
  navigator.sendBeacon?.("/api/click", new Blob([JSON.stringify({run, segment: segment || "general", source: a.dataset.src, url: a.href, rung: a.dataset.rung})], {type: "application/json"}));
});

$("#find-go").onclick = async () => {
  const fd = new FormData(); for (const f of $("#find-photo").files) fd.append("photos", f);
  const text = $("#find-text").value.trim(); if (text) fd.append("text", text);
  if (!fd.has("photos") && !text) return;
  $("#find-profile").innerHTML = ""; $("#ladder").innerHTML = ""; const status = $("#find-status");
  status.textContent = "Looking closely…"; const sources = [];
  const res = await fetch("/api/find", {method: "POST", body: fd});
  if (!res.ok) { status.textContent = "Something went wrong (" + res.status + ")."; return; }
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream: true}); let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const ev = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
      run = ev.run || run; segment = ev.segment || segment;
      if (ev.type === "profile") { $("#find-profile").innerHTML = profileView(ev.profile); status.textContent = "Searching stores and resale sites…"; }
      if (ev.type === "source") { sources.push(ev.error ? `${ev.source} ✕` : `${ev.source.split(":")[0]} ${ev.count}`); status.textContent = `Searched: ${sources.join(" · ")}`; }
      if (ev.type === "ladder") { $("#ladder").innerHTML = ladderView(ev.ladder, ev.stage); if (ev.stage === "final") status.textContent = `Done in ${(ev.ms/1000).toFixed(1)}s · ${ev.ladder.sources_searched.length} sources`; else status.textContent = "Checking which ones are the exact item…"; }
      if (ev.type === "error") status.textContent = "Error: " + ev.message;
    }
  }
};

$("#sell-go").onclick = async () => {
  const fd = new FormData(); for (const f of $("#sell-photo").files) fd.append("photos", f);
  if (!fd.has("photos")) return;
  const status = $("#sell-status"); status.textContent = "Reading the item and checking the market…"; $("#signoff").innerHTML = "";
  const res = await fetch("/api/sell", {method: "POST", body: fd});
  if (!res.ok) { status.textContent = "Something went wrong (" + res.status + ")."; return; }
  const b = await res.json(); status.textContent = "";
  const d = b.draft;
  const asks = b.photo_requests.map(r => `<li>${esc(r.reason)}</li>`).join("");
  const flags = b.flagged_fields.length ? `<div class="flag">Please check: ${b.flagged_fields.map(esc).join(", ")}</div>` : "";
  if (!d) { $("#signoff").innerHTML = `<div class="signoff">${flags}<div>${esc(b.price_note)}</div>${asks ? `<ul>${asks}</ul>` : ""}</div>`; return; }
  const attrs = Object.entries(d.attributes).map(([k,v]) => `<span class="chip">${esc(k)}: ${esc(v)}</span>`).join("");
  $("#signoff").innerHTML = `<div class="signoff">
    ${asks ? `<div><div class="k">One more photo would help</div><ul>${asks}</ul></div>` : ""}${flags}
    <div><div class="k">Title</div><input type="text" value="${esc(d.title)}"></div>
    <div class="row"><div style="flex:1"><div class="k">List price</div><input type="number" value="${Math.round(d.price_cents/100)}"></div>
      <div style="flex:1"><div class="k">Hidden minimum (never shown)</div><input type="number" value="${Math.round(d.hidden_minimum_cents/100)}"></div></div>
    <div class="src">Expected ${money(d.expected_cents)} · range ${money(d.range_cents[0])}–${money(d.range_cents[1])} · ${esc(d.price_confidence)} confidence. ${d.price_notes.map(esc).join(" ")}</div>
    <div><div class="k">Details</div><div class="chips">${attrs}<span class="chip">condition: ${esc(d.condition)}</span></div></div>
    <div><div class="k">Description</div><textarea rows="4">${esc(d.description)}</textarea></div>
    <div><div class="k">Priced from</div>${d.comps.map(c => `<div class="src"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a> · ${money(c.price_cents)}</div>`).join("") || '<div class="src">Retail price and condition</div>'}</div>
    <button class="primary" disabled title="Publishing turns on once eBay approves our developer account">Approve and list everywhere</button></div>`;
};
</script>
</body>
</html>
